<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смак Традиції — рецепти української кухні з калькулятором порцій</title>
  <meta name="description" content="Рецепти української кухні з покроковими інструкціями: борщ, вареники, деруни, банош. Калькулятор перерахує інгредієнти на потрібну кількість порцій.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Смак Традиції">
  <meta property="og:locale" content="uk_UA">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&amp;family=Manrope:wght@400;600;700&amp;display=swap">
  <script>
    // Тема ставиться ДО першого малювання, інакше сторінка «блимне» світлою темою.
    // Значення пише хук useLocalStorage у форматі JSON: "dark" / "light".
    try {
      const savedTheme = JSON.parse(localStorage.getItem('smak:theme'));
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) { /* тема за налаштуванням системи */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript><p class="state">Щоб користуватися сайтом, увімкніть JavaScript у браузері.</p></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
