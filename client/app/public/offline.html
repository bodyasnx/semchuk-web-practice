<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Немає з'єднання — Смак Традиції</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f5135">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <!-- Сторінку показує service worker (sw.js), коли немає інтернету. Усе потрібне вбудовано
       або заздалегідь закешовано: стилі — тут, логотип і шрифти — у кеші під час встановлення SW. -->
  <style>
    @font-face { font-family: "Lora"; font-weight: 600 700; font-display: swap; src: url("/fonts/lora-cyrillic.woff2") format("woff2"); }
    @font-face { font-family: "Manrope"; font-weight: 400 700; font-display: swap; src: url("/fonts/manrope-cyrillic.woff2") format("woff2"); }
    /* Кольори — з дизайн-токенів (src/styles/tokens.css) */
    :root {
      color-scheme: light;
      --color-bg: #fbf6ec; --color-surface: #ffffff; --color-text: #1c2620; --color-text-muted: #4e5a52;
      --color-primary: #1f5135; --color-primary-hover: #163d28; --color-on-primary: #ffffff;
      --color-focus: #1f5135; --color-divider: #e0d9cb;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --color-bg: #0f1e16; --color-surface: #162a1f; --color-text: #f3ede1; --color-text-muted: #bac4b8;
        --color-primary: #e2b04a; --color-primary-hover: #ecc36b; --color-on-primary: #1a1406;
        --color-focus: #e2b04a; --color-divider: #2c4636;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-bg: #0f1e16; --color-surface: #162a1f; --color-text: #f3ede1; --color-text-muted: #bac4b8;
      --color-primary: #e2b04a; --color-primary-hover: #ecc36b; --color-on-primary: #1a1406;
      --color-focus: #e2b04a; --color-divider: #2c4636;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--color-bg); color: var(--color-text);
      font: 400 1rem/1.6 "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      max-width: 32rem; width: 100%; text-align: center; padding: 2rem 1.5rem;
      background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 16px;
    }
    img { display: block; margin: 0 auto 1rem; }
    h1 { font: 700 clamp(1.5rem, 1.2rem + 1.5vw, 2rem)/1.25 "Lora", Georgia, serif; margin: 0 0 .75rem; }
    p { margin: 0 0 1rem; color: var(--color-text-muted); }
    button {
      font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; padding: .625rem 1.5rem;
      border: 0; border-radius: 999px; background: var(--color-primary); color: var(--color-on-primary);
    }
    button:hover { background: var(--color-primary-hover); }
    button:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
  </style>
  <script>
    // Та сама тема, яку людина обрала на сайті (ключ хука useLocalStorage)
    try {
      const savedTheme = JSON.parse(localStorage.getItem('smak:theme'));
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) { /* тема за налаштуванням системи */ }
  </script>
</head>
<body>
  <main>
    <img src="/assets/logo-mark.svg" alt="" width="64" height="64">
    <h1>Немає з'єднання з інтернетом</h1>
    <p>Рецепти завантажуються з сервера, тому для перегляду каталогу, сторінок рецептів
      і калькулятора порцій потрібен інтернет.</p>
    <p>Перевірте Wi-Fi або мобільні дані — сторінка оновиться сама, щойно з'єднання повернеться.</p>
    <button type="button" id="retry">Спробувати ще</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => location.reload());
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
